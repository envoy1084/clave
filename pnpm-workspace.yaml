packages:
  - apps/*
  - contracts
  - crates
  - packages/*
  - tools/*

catalog:
  "@aztec-labs/foundation": 6.0.0
  "@aztec-labs/stdlib": 6.0.0
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@types/node": 26.6.6
  "@vitest/coverage-v8": 5.1.0
  klarity: 0.3.0
  lefthook: 2.2.2
  oxfmt: 0.76.0
  oxlint: 1.91.0
  publint: 0.3.25
  tsdown: 0.23.7
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.1.0

allowBuilds:
  lefthook: true
  # Optional native accelerators pulled in by @aztec-labs/*; not needed by tools/aztec-vectors.
  leveldown: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@rolldown/binding-android-arm-eabi@1.3.0"
  - "@rolldown/binding-android-arm64@1.3.0"
  - "@rolldown/binding-darwin-arm64@1.3.0"
  - "@rolldown/binding-darwin-x64@1.3.0"
  - "@rolldown/binding-freebsd-x64@1.3.0"
  - "@rolldown/binding-linux-arm-gnueabihf@1.3.0"
  - "@rolldown/binding-linux-arm64-gnu@1.3.0"
  - "@rolldown/binding-linux-arm64-musl@1.3.0"
  - "@rolldown/binding-linux-ppc64-gnu@1.3.0"
  - "@rolldown/binding-linux-s390x-gnu@1.3.0"
  - "@rolldown/binding-linux-x64-gnu@1.3.0"
  - "@rolldown/binding-linux-x64-musl@1.3.0"
  - "@rolldown/binding-openharmony-arm64@1.3.0"
  - "@rolldown/binding-wasm32-wasi@1.3.0"
  - "@rolldown/binding-win32-arm64-msvc@1.3.0"
  - "@rolldown/binding-win32-x64-msvc@1.3.0"
  - rolldown-plugin-dts@0.30.0
  - rolldown@1.3.0
  - tsdown@0.23.7
