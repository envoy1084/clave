packages:
  - apps/*
  - contracts
  - crates
  - crates/napi
  - packages/*
  - tools/*

catalog:
  "@aztec-foundation/bb.js": 6.0.0
  "@aztec-labs/accounts": 6.0.0
  "@aztec-labs/aztec.js": 6.0.0
  "@aztec-labs/entrypoints": 6.0.0
  "@aztec-labs/foundation": 6.0.0
  "@aztec-labs/key-store": 6.0.0
  "@aztec-labs/kv-store": 6.0.0
  "@aztec-labs/noir-contracts.js": 6.0.0
  "@aztec-labs/pxe": 6.0.0
  "@aztec-labs/stdlib": 6.0.0
  "@aztec-labs/wallet-sdk": 6.0.0
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@napi-rs/cli": 3.10.9
  "@types/node": 26.6.6
  "@vitest/coverage-v8": 5.1.0
  klarity: 0.3.0
  lefthook: 2.2.2
  oxfmt: 0.76.0
  oxlint: 1.91.0
  publint: 0.3.25
  tsdown: 0.23.7
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.1.0

allowBuilds:
  lefthook: true
  # Downloads the Electron runtime the desktop app runs on.
  electron: true
  # Windows installer tooling for electron-builder; not used by our macOS/Linux builds.
  electron-winstaller: false
  # Install scripts pulled in by @aztec-labs/*: native prebuilds load at runtime without them, and protobufjs only
  # prints a version notice.
  leveldown: false
  lmdb: false
  msgpackr-extract: false
  protobufjs: false

minimumReleaseAgeExclude:
  - "@rolldown/binding-android-arm-eabi@1.3.0"
  - "@rolldown/binding-android-arm64@1.3.0"
  - "@rolldown/binding-darwin-arm64@1.3.0"
  - "@rolldown/binding-darwin-x64@1.3.0"
  - "@rolldown/binding-freebsd-x64@1.3.0"
  - "@rolldown/binding-linux-arm-gnueabihf@1.3.0"
  - "@rolldown/binding-linux-arm64-gnu@1.3.0"
  - "@rolldown/binding-linux-arm64-musl@1.3.0"
  - "@rolldown/binding-linux-ppc64-gnu@1.3.0"
  - "@rolldown/binding-linux-s390x-gnu@1.3.0"
  - "@rolldown/binding-linux-x64-gnu@1.3.0"
  - "@rolldown/binding-linux-x64-musl@1.3.0"
  - "@rolldown/binding-openharmony-arm64@1.3.0"
  - "@rolldown/binding-wasm32-wasi@1.3.0"
  - "@rolldown/binding-win32-arm64-msvc@1.3.0"
  - "@rolldown/binding-win32-x64-msvc@1.3.0"
  - rolldown-plugin-dts@0.30.0
  - rolldown@1.3.0
  - tsdown@0.23.7
  - framer-motion@14.10.0
  - lucide-react@1.70.0
  - motion-dom@14.10.0
  - motion@14.10.0
  - playwright-core@1.65.0

patchedDependencies:
  "@aztec-labs/pxe@6.0.0": patches/@aztec-labs__pxe@6.0.0.patch
