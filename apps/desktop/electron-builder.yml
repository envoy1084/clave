# Packaging (`pnpm package` builds an unpacked app in dist/release; CI release builds add installers).
appId: network.tecpan.desktop
productName: Tecpan
copyright: Tecpan
directories:
  output: dist/release
  buildResources: resources
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
  - "!**/*.map"
  # The napi testing build exposes secret helpers for tests; it must never ship.
  - "!**/node_modules/@tecpan/napi/dist/testing/**"
  # Only SponsoredFPC (fees) and Token (assets) artifacts are used; the other 60 MB of contracts are not.
  - "!**/node_modules/@aztec-labs/noir-contracts.js/artifacts/**"
  - "**/node_modules/@aztec-labs/noir-contracts.js/artifacts/sponsored_fpc_contract-SponsoredFPC.json"
  - "**/node_modules/@aztec-labs/noir-contracts.js/artifacts/token_contract-Token.json"
# Native code must live outside the asar: Barretenberg's `bb` prover binary, Node-API addons (napi, lmdb, Aztec's).
asarUnpack:
  - "**/node_modules/@aztec-foundation/bb.js/build/**/bb"
  - "**/*.node"
# The member's keeper ships beside the app (built with `cargo build --release -p tecpan-keeper`).
extraResources:
  - from: ../../crates/target/release/tecpan-keeper
    to: bin/tecpan-keeper
# Electron fuses: no running as plain Node, no Node options or inspector flags from outside, the app only from its
# integrity-checked asar, cookies encrypted.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
mac:
  files:
    - "!**/node_modules/@aztec-foundation/bb.js/build/*-linux/**"
    - "!**/node_modules/@aztec-foundation/ipc-runtime/build/*-linux/**"
  category: public.app-category.finance
  icon: resources/icon.icns
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
    - target: zip
linux:
  files:
    - "!**/node_modules/@aztec-foundation/bb.js/build/*-macos/**"
    - "!**/node_modules/@aztec-foundation/ipc-runtime/build/*-macos/**"
  icon: resources/icon.png
  category: Finance
  target:
    - AppImage
    - deb
