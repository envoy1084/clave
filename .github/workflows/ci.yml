name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      # @tecpan/napi compiles the Rust crates into a Node addon.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: crates
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check .
      - run: pnpm exec oxlint --deny-warnings .
      - run: pnpm exec turbo run lint typecheck build test '--filter=./packages/*' '--filter=./apps/*' '--filter=./tools/*' '--filter=./crates/napi'

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: crates
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/Cargo.toml

  noir:
    name: Noir
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Cache Aztec toolchain and Nargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.aztec
            ~/nargo
          key: aztec-${{ hashFiles('.aztecrc') }}-${{ hashFiles('contracts/**/Nargo.toml') }}
          restore-keys: aztec-${{ hashFiles('.aztecrc') }}-
      - name: Install Aztec
        working-directory: .
        run: |
          VERSION="$(cat .aztecrc)"
          if [ ! -x "$HOME/.aztec/versions/$VERSION/bin/aztec" ]; then
            curl -fsSL "https://install.aztec-labs.com/$VERSION/install" | VERSION="$VERSION" bash
          fi
          ln -sfn "$HOME/.aztec/versions/$VERSION" "$HOME/.aztec/current"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
      - run: aztec-nargo fmt --workspace --check
      - run: aztec compile
      - run: aztec test

  network:
    name: Keeper network (separate namespaces)
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: crates/keeper/tests/network/run.sh

  e2e:
    name: End to end (local network)
    runs-on: ubuntu-latest
    needs: [typescript, noir]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: crates
      - name: Cache Aztec toolchain and Nargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.aztec
            ~/nargo
          key: aztec-${{ hashFiles('.aztecrc') }}-${{ hashFiles('contracts/**/Nargo.toml') }}
          restore-keys: aztec-${{ hashFiles('.aztecrc') }}-
      - name: Install Aztec
        run: |
          VERSION="$(cat .aztecrc)"
          if [ ! -x "$HOME/.aztec/versions/$VERSION/bin/aztec" ]; then
            curl -fsSL "https://install.aztec-labs.com/$VERSION/install" | VERSION="$VERSION" bash
          fi
          ln -sfn "$HOME/.aztec/versions/$VERSION" "$HOME/.aztec/current"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Start local network
        run: |
          aztec start --local-network > network.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf -X POST localhost:8080 -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"node_getBlockNumber","params":[]}' && exit 0
            sleep 5
          done
          cat network.log
          exit 1
      - run: pnpm exec turbo run test:e2e --filter=@tecpan/vault-wallet
