# cargo-deny: dependency policy for the Clave Rust workspace.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is a compile-time proc macro flagged as unmaintained (not vulnerable). It is reached only on Linux through
  # libp2p's interface watcher (if-watch -> netlink-packet-core). Revisit when libp2p drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro, compile time only, via libp2p if-watch" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list anticipates future dependencies; unused entries are expected.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
