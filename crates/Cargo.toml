[workspace]
resolver = "3"
members = ["tecpan-agent", "tecpan-crypto", "tecpan-napi", "tecpan-relay", "tecpan-wire"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Shared dependency versions; crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
tecpan-crypto = { path = "tecpan-crypto" }
tecpan-wire = { path = "tecpan-wire" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
