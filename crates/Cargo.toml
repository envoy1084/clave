[workspace]
resolver = "3"
members = ["keeper", "cli", "crypto", "demo", "napi", "relay", "wire"]
# Fuzz targets build with nightly via cargo-fuzz and are their own workspace.
exclude = ["crypto/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
publish = false

# Shared dependency versions; crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
clave-crypto = { path = "crypto" }
clave-wire = { path = "wire" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
