[package]
name = "clave-demo"
description = "clave-demo: a narrated two-member Clave demo in one terminal (Alice and Bob side by side)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "clave-demo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
portable-pty = "0.9"
ratatui = "0.30"
serde_json = "1"
tui-term = "0.3"
vt100 = "0.16"
