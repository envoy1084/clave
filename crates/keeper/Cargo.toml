[package]
name = "tecpan-keeper"
description = "Tecpan keeper: viewing-share custody, threshold ECDH, ceremonies and the proposal store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tecpan-keeper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand_core = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
subtle = "2.6"
tecpan-crypto = { workspace = true }
tecpan-wire = { workspace = true }
thiserror = "2"
tokio = { version = "1.54", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "sync",
  "time",
  "signal",
  "fs",
] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
rand_chacha = "0.10"
tempfile = "3.27"
tecpan-crypto = { workspace = true, features = ["test-utils"] }
