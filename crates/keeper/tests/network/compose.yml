# Three keepers in three separate, internal networks. The only node attached to all of them is the relay, so keepers
# can reach each other only through relay circuits. The driver has no network at all: it talks to each keeper over the
# RPC socket in that keeper's data volume. Run with ./run.sh.
name: clave-network-test

x-keeper: &keeper
  image: clave-node:test
  environment:
    RUST_LOG: "${RUST_LOG:-info}"
  command:
    - sh
    - -c
    - >-
      exec clave-keeper run --data-dir /data
      --listen /ip4/0.0.0.0/udp/4001/quic-v1 --listen /ip4/0.0.0.0/tcp/4001
      --relay /dns4/relay/udp/4001/quic-v1/p2p/${RELAY_PEER:-}
      --log-format json
  depends_on: [relay]

services:
  relay:
    image: clave-node:test
    command:
      [
        "clave-relay",
        "run",
        "--data-dir",
        "/data",
        "--health",
        "0.0.0.0:9090",
        "--log-format",
        "json",
      ]
    volumes: [relay:/data]
    networks:
      net1: { aliases: [relay] }
      net2: { aliases: [relay] }
      net3: { aliases: [relay] }

  keeper1:
    <<: *keeper
    environment: { CLAVE_KEEPER_PASSPHRASE: network-test-one, RUST_LOG: "${RUST_LOG:-info}" }
    volumes: [k1:/data]
    networks: [net1]

  keeper2:
    <<: *keeper
    environment: { CLAVE_KEEPER_PASSPHRASE: network-test-two, RUST_LOG: "${RUST_LOG:-info}" }
    volumes: [k2:/data]
    networks: [net2]

  keeper3:
    <<: *keeper
    environment: { CLAVE_KEEPER_PASSPHRASE: network-test-three, RUST_LOG: "${RUST_LOG:-info}" }
    volumes: [k3:/data]
    networks: [net3]

  driver:
    image: clave-node:test
    network_mode: none
    command: ["network_scenario", "/k1", "/k2", "/k3"]
    volumes: [k1:/k1, k2:/k2, k3:/k3]
    profiles: [driver]

networks:
  net1: { internal: true }
  net2: { internal: true }
  net3: { internal: true }

volumes:
  relay: {}
  k1: {}
  k2: {}
  k3: {}
