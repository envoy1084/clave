[package]
name = "tecpan-wire"
description = "Wire format for messages exchanged between Tecpan engines, keepers and relays"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# libp2p request-response codec and protocol names for keepers and relays.
p2p = ["dep:futures", "dep:libp2p"]

[dependencies]
futures = { version = "0.3", optional = true }
libp2p = { version = "0.57", default-features = false, features = [
  "request-response",
], optional = true }
base64 = "0.22"
ed25519-dalek = "3"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tecpan-crypto = { workspace = true }
thiserror = "2"
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
hex = "0.4"
rand_chacha = "0.10"
tecpan-crypto = { workspace = true, features = ["test-utils"] }
serde_json = "1"
