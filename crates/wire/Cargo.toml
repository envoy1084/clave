[package]
name = "tecpan-wire"
description = "Wire format for messages exchanged between Tecpan engines, keepers and relays"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "3"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tecpan-crypto = { workspace = true }
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
hex = "0.4"
rand_chacha = "0.10"
tecpan-crypto = { workspace = true, features = ["test-utils"] }
serde_json = "1"
