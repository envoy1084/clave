[package]
name = "tecpan-crypto"
description = "Threshold viewing-key cryptography for Tecpan vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-grumpkin = { version = "0.6", default-features = false }
hpke = "0.15"
rand_core = "0.10.1"
sha2 = "0.11"
subtle = "2.6"
taceo-poseidon2 = { version = "0.3", default-features = false, features = ["bn254", "t4"] }
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
proptest = "1.12"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
