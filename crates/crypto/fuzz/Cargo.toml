[package]
name = "tecpan-crypto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tecpan-crypto = { path = ".." }
tecpan-wire = { path = "../../wire" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_partial"
path = "fuzz_targets/verify_partial.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_open"
path = "fuzz_targets/envelope_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

# Standalone workspace: built with `cargo +nightly fuzz`, never by the stable workspace.
[workspace]
